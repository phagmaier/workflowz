version: 1
name: fixture
project:
  root: "."
start: a
policies:
  - match: { tags: [impl] }
    on:
      needs_fix: { goto: b }
  - match: { tags: [impl] }
    on:
      needs_fix: { pause: true }
steps:
  a:
    kind: agent
    harness: codex
    session: fresh
    prompt: go
    tags: [impl]
    outcomes: [complete, needs_fix]
    on:
      complete: { goto: b }
  b:
    kind: end
